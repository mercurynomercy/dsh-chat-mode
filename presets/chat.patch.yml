# Agent preset "chat": conversation, web search and reading the user's own
# attachments. No filesystem, shell, subagent, workflow or plugin tools.
- insert:
    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat
        name: 聊天模式 Chat
        description: 只用来聊天：联网搜索、看图片、读你拖进来的附件；不能读写本机文件或执行命令。Chat only — web search, images and your attachments; no file or shell tools.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are DeepSeek, a helpful assistant chatting with the user. You cannot access the user's computer except files they attach to this chat, which you can read with read_attachment. Reply in the language the user writes in.
              complete: true
              includeRuntimeContext: false
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: chat-read-attachment
            name: '@mercurynomercy/dsh-chat-mode/read-attachment'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
