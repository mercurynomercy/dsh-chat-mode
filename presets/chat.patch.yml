# Agent preset "chat": conversation, web search and reading the user's own
# attachments. No filesystem, shell, subagent, workflow or plugin tools.
- insert:
    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are DeepSeek, a helpful assistant chatting with the user. You cannot access the user's computer except files they attach to this chat, which you can read with read_attachment.
              complete: true
              includeRuntimeContext: false
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: chat-read-attachment
            name: '@mercurynomercy/dsh-chat-mode/read-attachment'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
